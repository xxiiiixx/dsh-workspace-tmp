<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Workspace Tmp">
  <defs>
    <linearGradient id="ws-tmp-workspace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8fd6"/>
      <stop offset="1" stop-color="#3d5da8"/>
    </linearGradient>
    <linearGradient id="ws-tmp-scratch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3b34b"/>
      <stop offset="1" stop-color="#d98a1f"/>
    </linearGradient>
  </defs>
  <!-- The project workspace: a folder that stays intact. -->
  <path d="M5 17a4 4 0 0 1 4-4h9l3.5 4H34a4 4 0 0 1 4 4v17a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z"
        fill="url(#ws-tmp-workspace)"/>
  <rect x="9" y="25" width="22" height="2.8" rx="1.4" fill="#c9d8f5" opacity="0.85"/>
  <rect x="9" y="31" width="14" height="2.8" rx="1.4" fill="#c9d8f5" opacity="0.6"/>
  <!-- The move-out arrow: content leaves the project. -->
  <path d="M37 30 L50 17" fill="none" stroke="#f0c987" stroke-width="3" stroke-linecap="round"/>
  <path d="M42.5 16 L51 16 L51 24.5" fill="none" stroke="#f0c987" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The scratch area: beside the workspace, outside it, dashed to read as temporary. -->
  <rect x="33" y="35" width="25" height="19" rx="4"
        fill="url(#ws-tmp-scratch)" stroke="#8a5a10" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M39 41.5h13M37 46.5h17" stroke="#fff4dd" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
</svg>

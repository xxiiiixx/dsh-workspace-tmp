<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Workspace Tmp">
  <defs>
    <linearGradient id="ws-tmp-workspace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8fd6"/>
      <stop offset="1" stop-color="#3d5da8"/>
    </linearGradient>
    <linearGradient id="ws-tmp-scratch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3b34b"/>
      <stop offset="1" stop-color="#d98a1f"/>
    </linearGradient>
  </defs>
  <!-- The project workspace: a folder that stays intact. -->
  <path d="M7 16a4 4 0 0 1 4-4h10l4 5h18a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H11a4 4 0 0 1-4-4z"
        fill="url(#ws-tmp-workspace)"/>
  <rect x="11" y="25" width="26" height="3" rx="1.5" fill="#c9d8f5" opacity="0.85"/>
  <rect x="11" y="32" width="18" height="3" rx="1.5" fill="#c9d8f5" opacity="0.6"/>
  <!-- The scratch area: beside the workspace, outside it, dashed to read as temporary. -->
  <rect x="34" y="36" width="23" height="17" rx="3.5"
        fill="url(#ws-tmp-scratch)" stroke="#8a5a10" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M40 41.5h11M37.5 45.5h16" stroke="#fff4dd" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <!-- The exit arrow: content leaves the project, nothing stays behind. -->
  <path d="M43 30l7-6 7 6" fill="none" stroke="#f7d9a3" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
